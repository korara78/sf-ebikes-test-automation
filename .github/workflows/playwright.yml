name: Playwright Tests
on:
  # No `push` trigger: branch protection on main/master requires a PR (see
  # Guide 8), so the only thing that could ever push directly to them is a
  # merge — already verified by its own PR run below. A push trigger here
  # would also double-fire alongside pull_request's `synchronize` event on
  # every commit to an open PR branch, doubling load on the live org this
  # suite runs against for zero extra safety.
  pull_request:
    branches: [ main, master ]
# Only one run against the live org at a time. A manual rerun (or a second
# push) while a run is still in progress queues behind it instead of
# executing concurrently — confirmed to matter: two full 59-test runs
# hitting this personal Dev Edition org simultaneously produced measurably
# broader, slower failures than either running alone.
concurrency:
  group: playwright-tests
  cancel-in-progress: false
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Install Salesforce CLI
      run: npm install --global @salesforce/cli
    - name: Authenticate to Salesforce via JWT Bearer Flow
      # Headless CI auth — a Connected App with a self-signed cert, distinct
      # from the local sf-CLI-piggyback approach `auth.setup.ts` uses when
      # run on a machine that's already interactively logged in (see Guide 4).
      # Aliased as `mydevorg` to match auth.setup.ts's default SF_TARGET_ORG,
      # so no further config is needed for it to pick this session up.
      run: |
        echo "${{ secrets.SF_JWT_KEY }}" > server.key
        sf org login jwt \
          --client-id "${{ secrets.SF_CONSUMER_KEY }}" \
          --jwt-key-file server.key \
          --username "${{ secrets.SF_USERNAME }}" \
          --instance-url "${{ secrets.SF_LOGIN_URL }}" \
          --alias mydevorg
        rm -f server.key
    - name: Run Playwright tests
      run: npx playwright test
      env:
        E_BIKES_BASE_URL: ${{ secrets.E_BIKES_BASE_URL }}
    - name: Check traceability matrix is up to date
      # Regenerates the matrix from this run's own results, then fails if
      # the committed file doesn't match (timestamps excluded — see
      # scripts/check-matrix-freshness.mjs). Catches the case where code or
      # test changes were committed without also running `npm run gen:matrix`.
      # No `if:` guard — if the test step above already failed, this job is
      # failing regardless, so there's no need to also check matrix freshness.
      run: |
        npm run gen:matrix
        npm run check:matrix
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
