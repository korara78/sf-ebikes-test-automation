name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      # Guest Suite only: the Internal Suite's `setup` project shells out to
      # the `sf` CLI, which isn't installed/authenticated in CI (see Guide 4).
      # Revisit once Internal Suite CI credentialing is wired up.
      run: npx playwright test --project=chromium --project=firefox --project=webkit
      env:
        E_BIKES_BASE_URL: ${{ secrets.E_BIKES_BASE_URL }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
